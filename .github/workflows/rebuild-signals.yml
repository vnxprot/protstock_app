name: Rebuild consolidated signals

on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: Stored EOD date to re-evaluate (YYYY-MM-DD)
        required: true
        type: string
      send_telegram:
        description: Send the newly consolidated actions to Telegram
        required: true
        default: false
        type: boolean
      symbol:
        description: Optional single symbol to rebuild first
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: protstock-signal-rebuild-${{ inputs.symbol || 'all' }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e ".[data]"
      - name: Rebuild signals from stored prices
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_SYMBOL: ${{ inputs.symbol }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          args=()
          if [ -n "$TARGET_SYMBOL" ]; then
            offset=$(python - <<'PY'
          import os
          import re
          from protstock.config import Settings
          from protstock.supabase_rest import SupabaseRestClient
          symbol = os.environ['TARGET_SYMBOL'].upper()
          if not re.fullmatch(r'[A-Z0-9]{3,10}', symbol):
              raise ValueError('Invalid symbol')
          client = SupabaseRestClient(Settings.from_env())
          try:
              print(next(index for index, row in enumerate(client.active_symbols()) if row['symbol'] == symbol))
          finally:
              client.close()
          PY
            )
            args+=(--symbol-offset "$offset" --symbol-limit 1)
          fi
          python -m protstock.cli rebuild-signals --date "$TRADING_DATE" "${args[@]}"
      - name: Verify MACD zone assessments
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_SYMBOL: ${{ inputs.symbol }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          python - <<'PY'
          import os
          import httpx

          headers = {
              'apikey': os.environ['SUPABASE_SERVICE_ROLE_KEY'],
              'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_ROLE_KEY'],
              'Prefer': 'count=exact',
          }
          base = os.environ['SUPABASE_URL'] + '/rest/v1'
          day = os.environ['TRADING_DATE']
          with httpx.Client(base_url=base, headers=headers, timeout=30) as client:
              response = client.get('/macd_divergence_assessments', params={
                  'select': 'symbol_id', 'as_of_date': 'eq.' + day,
                  'version': 'eq.MACD_BULLISH_DIVERGENCE_ZONE_V4',
                  'oscillator': 'eq.MACD_LINE', 'limit': '1',
              })
              response.raise_for_status()
              count = int(response.headers['content-range'].split('/')[-1])
              if count == 0:
                  raise RuntimeError('No MACD V4 assessments stored for ' + day)
              print(f'MACD V4 stored assessments on {day}: {count}')
              symbol = os.environ.get('TARGET_SYMBOL', '').upper()
              if symbol:
                  response = client.get('/symbols', params={'select': 'id', 'symbol': 'eq.' + symbol})
                  response.raise_for_status()
                  symbols = response.json()
                  if not symbols:
                      raise RuntimeError('Unknown symbol ' + symbol)
                  response = client.get('/macd_divergence_assessments', params={
                      'select': 'swings,stage,trigger_date,evidence',
                      'symbol_id': 'eq.' + str(symbols[0]['id']), 'as_of_date': 'eq.' + day,
                      'version': 'eq.MACD_BULLISH_DIVERGENCE_ZONE_V4',
                      'oscillator': 'eq.MACD_LINE', 'order': 'swings.asc',
                  })
                  response.raise_for_status()
                  rows = response.json()
                  if not rows:
                      raise RuntimeError(f'No MACD V4 assessment for {symbol} on {day}')
                  for row in rows:
                      zones = row['evidence']['zones']
                      print(symbol, row['swings'], row['stage'], row['trigger_date'],
                            [(item['price_date'], item['price_low'], item['macd_date'], item['macd_low'])
                             for item in zones])
          PY
      - name: Send Telegram only when explicitly requested
        if: inputs.send_telegram
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m protstock.cli send-eod-alerts --date "${{ inputs.trading_date }}"
