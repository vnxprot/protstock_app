name: Rebuild consolidated signals

on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: Stored EOD date to re-evaluate (YYYY-MM-DD)
        required: true
        type: string
      send_telegram:
        description: Send the newly consolidated actions to Telegram
        required: true
        default: false
        type: boolean
      start_date:
        description: First unfinished session of a historical rebuild through trading_date (YYYY-MM-DD)
        required: false
        default: ''
        type: string
      symbol:
        description: Optional single symbol to rebuild first
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: protstock-rebuild-and-vci-production
  queue: max

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e "."
      - name: Rebuild signals from stored prices
        id: rebuild
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_SYMBOL: ${{ inputs.symbol }}
          TRADING_DATE: ${{ inputs.trading_date }}
          START_DATE: ${{ inputs.start_date }}
          SEND_TELEGRAM: ${{ inputs.send_telegram }}
        run: |
          args=()
          offset=''
          if [ -n "$TARGET_SYMBOL" ]; then
            offset=$(python - <<'PY'
          import os
          import re
          from protstock.config import Settings
          from protstock.supabase_rest import SupabaseRestClient
          symbol = os.environ['TARGET_SYMBOL'].upper()
          if not re.fullmatch(r'[A-Z0-9]{3,10}', symbol):
              raise ValueError('Invalid symbol')
          client = SupabaseRestClient(Settings.from_env())
          try:
              print(next(index for index, row in enumerate(client.active_symbols()) if row['symbol'] == symbol))
          finally:
              client.close()
          PY
            )
            args+=(--symbol-offset "$offset" --symbol-limit 1)
          fi
          if [ -z "$START_DATE" ]; then
            python -m protstock.cli rebuild-signals --date "$TRADING_DATE" "${args[@]}"
          else
            if [ "$SEND_TELEGRAM" = true ]; then
              echo 'Historical range rebuilds do not send Telegram alerts.' >&2
              exit 1
            fi
            SYMBOL_OFFSET="$offset" python - <<'PY'
          import os
          from datetime import date

          from protstock.config import Settings
          from protstock.eod import rebuild_signals
          from protstock.supabase_rest import SupabaseRestClient

          start = date.fromisoformat(os.environ['START_DATE'])
          end = date.fromisoformat(os.environ['TRADING_DATE'])
          if start > end:
              raise SystemExit('start_date must be on or before trading_date')
          client = SupabaseRestClient(Settings.from_env())
          try:
              index = client.market_index('VNINDEX')
              sessions = sorted(set(client.index_price_dates(index['id'], start, end)))
          finally:
              client.close()
          if not sessions:
              raise SystemExit('No stored VNINDEX sessions in the requested range')

          batch, remaining = sessions[:3], sessions[3:]
          offset = os.environ['SYMBOL_OFFSET']
          symbol_scope = {'symbol_offset': int(offset), 'symbol_limit': 1} if offset else {}

          def checkpoint(message):
              print(message, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f'- {message}\n')

          for session in batch:
              checkpoint(f'Started {session}. If interrupted before completion, resume from {session}.')
              result = rebuild_signals(date.fromisoformat(session), historical=True, **symbol_scope)
              if result['status'] != 'SUCCEEDED' or not result['covered_symbols']:
                  raise SystemExit(f"Rebuild incomplete for {session}; resume from {session} (job {result['job_id']})")
              checkpoint(f"Completed {session}: {result['covered_symbols']}/{result['expected_symbols']} symbols "
                         f"({result['publication_status']}, job {result['job_id']}).")

          if remaining:
              checkpoint(f'Next batch starts at {remaining[0]}.')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(f'next_start={remaining[0]}\n')
          PY
          fi
      - name: Queue the next historical batch
        if: steps.rebuild.outputs.next_start != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_START: ${{ steps.rebuild.outputs.next_start }}
          TRADING_DATE: ${{ inputs.trading_date }}
          TARGET_SYMBOL: ${{ inputs.symbol }}
        run: |
          gh workflow run rebuild-signals.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f start_date="$NEXT_START" -f trading_date="$TRADING_DATE" \
            -f symbol="$TARGET_SYMBOL" -f send_telegram=false
      - name: Verify MACD zone assessments
        if: inputs.start_date == ''
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_SYMBOL: ${{ inputs.symbol }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          python - <<'PY'
          import os
          import httpx

          headers = {
              'apikey': os.environ['SUPABASE_SERVICE_ROLE_KEY'],
              'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_ROLE_KEY'],
              'Prefer': 'count=exact',
          }
          base = os.environ['SUPABASE_URL'] + '/rest/v1'
          day = os.environ['TRADING_DATE']
          with httpx.Client(base_url=base, headers=headers, timeout=30) as client:
              response = client.get('/macd_divergence_assessments', params={
                  'select': 'symbol_id', 'as_of_date': 'eq.' + day,
                  'version': 'eq.MACD_BULLISH_DIVERGENCE_ZONE_V0_0_0',
                  'oscillator': 'eq.MACD_LINE', 'limit': '1',
              })
              response.raise_for_status()
              count = int(response.headers['content-range'].split('/')[-1])
              if count == 0:
                  raise RuntimeError('No MACD v0.0.0 assessments stored for ' + day)
              print(f'MACD v0.0.0 stored assessments on {day}: {count}')
              symbol = os.environ.get('TARGET_SYMBOL', '').upper()
              if symbol:
                  response = client.get('/symbols', params={'select': 'id', 'symbol': 'eq.' + symbol})
                  response.raise_for_status()
                  symbols = response.json()
                  if not symbols:
                      raise RuntimeError('Unknown symbol ' + symbol)
                  response = client.get('/macd_divergence_assessments', params={
                      'select': 'swings,stage,trigger_date,evidence',
                      'symbol_id': 'eq.' + str(symbols[0]['id']), 'as_of_date': 'eq.' + day,
                      'version': 'eq.MACD_BULLISH_DIVERGENCE_ZONE_V0_0_0',
                      'oscillator': 'eq.MACD_LINE', 'order': 'swings.asc',
                  })
                  response.raise_for_status()
                  rows = response.json()
                  if not rows:
                      raise RuntimeError(f'No MACD V5 assessment for {symbol} on {day}')
                  for row in rows:
                      zones = row['evidence']['zones']
                      print(symbol, row['swings'], row['stage'], row['trigger_date'],
                            [(item['price_date'], item['price_low'], item['macd_date'], item['macd_low'])
                             for item in zones])
          PY
      - name: Send Telegram only when explicitly requested
        if: inputs.send_telegram && inputs.start_date == ''
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m protstock.cli send-eod-alerts --date "${{ inputs.trading_date }}"
