name: EOD Fast Lane

on:
  schedule:
    # 16:15 Asia/Ho_Chi_Minh after the regular Vietnamese market close.
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
    inputs:
      trading_date:
        description: Optional completed trading date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: protstock-eod
  cancel-in-progress: false

jobs:
  ingest:
    name: Fast ingest ${{ matrix.source }} · ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: A–K
            source: KBS
            offset: 0
            limit: 101
          - label: L–Z
            source: VCI
            offset: 101
            limit: 101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,data]"
      - run: protstock validate-universe data/universe.csv
      - name: Ingest and analyze assigned Fast Lane shard
        id: ingest
        continue-on-error: true
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          args=(--fast-lane --skip-breadth-snapshot --source "${{ matrix.source }}" --symbol-offset "${{ matrix.offset }}" --symbol-limit "${{ matrix.limit }}")
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          protstock eod "${args[@]}"
      - name: Report partial shard
        if: steps.ingest.outcome == 'failure'
        run: echo "::warning::This shard was partial or failed; the final alert step remains enabled for stored signals."

  finalize:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[data]"
      - name: Verify full coverage and publish market breadth
        id: finalize
        continue-on-error: true
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          args=()
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          protstock finalize-fast-eod "${args[@]}"
      - name: Report incomplete coverage
        if: steps.finalize.outcome == 'failure'
        run: echo "::warning::Fast Lane coverage was incomplete; Telegram alerts will still send any eligible stored signals."
      - name: Send final concise Telegram EOD alerts
        if: always()
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          args=()
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          protstock send-eod-alerts "${args[@]}"
