name: EOD Fast Lane

on:
  schedule:
    # 15:30 Asia/Ho_Chi_Minh (UTC+7).
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      trading_date:
        description: Optional completed trading date (YYYY-MM-DD)
        required: false
        type: string
      skip_alerts:
        description: Repair data without resending Telegram alerts
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: protstock-eod
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.status.outputs.action }}
      active_count: ${{ steps.status.outputs.active_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - id: status
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
          FORCE_RERUN: ${{ github.event_name == 'workflow_dispatch' && inputs.trading_date != '' }}
        run: python .github/scripts/eod_status.py fast-lane

  ingest:
    needs: preflight
    if: needs.preflight.outputs.action == 'RUN'
    name: Fast ingest KBS · shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,data]"
      - run: protstock validate-universe data/universe.csv
      - name: Ingest and analyze assigned Fast Lane shard
        id: ingest
        continue-on-error: true
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
          ACTIVE_COUNT: ${{ needs.preflight.outputs.active_count }}
          SHARD: ${{ matrix.shard }}
        run: |
          half=$(( (ACTIVE_COUNT + 1) / 2 ))
          if [ "$SHARD" = 0 ]; then offset=0; limit=$half; else offset=$half; limit=$(( ACTIVE_COUNT - half )); fi
          args=(--fast-lane --skip-breadth-snapshot --source KBS --symbol-offset "$offset" --symbol-limit "$limit" --pause-seconds 13)
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          protstock eod "${args[@]}"
      - name: Report partial shard
        if: steps.ingest.outcome == 'failure'
        run: echo "::warning::This shard was partial or failed; the final alert step remains enabled for stored signals."

  finalize:
    needs: ingest
    if: needs.ingest.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[data]"
      - name: Publish market breadth and signals from available same-day snapshots
        id: finalize
        continue-on-error: true
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          args=()
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          protstock finalize-fast-eod --allow-partial "${args[@]}"
      - name: Report publish failure
        if: steps.finalize.outcome == 'failure'
        run: echo "::error::Same-day Market Health or signals could not be published; Telegram alerts are withheld."
      - name: Send final concise Telegram EOD alerts
        if: steps.finalize.outcome == 'success' && inputs.skip_alerts != true
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          args=()
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          protstock send-eod-alerts "${args[@]}"
