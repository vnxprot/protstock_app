name: EOD Fast Lane

on:
  schedule:
    # 15:30 Asia/Ho_Chi_Minh (UTC+7).
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      trading_date:
        description: Optional completed trading date (YYYY-MM-DD)
        required: false
        type: string
      skip_alerts:
        description: Repair data without resending Telegram alerts
        required: false
        default: false
        type: boolean
      skip_backtests:
        description: Repair EOD without processing the personal backtest queue
        required: false
        default: true
        type: boolean
      force_rerun:
        description: Recompute existing data instead of retrying missing symbols
        required: false
        default: false
        type: boolean
      publish_only:
        description: Finalize stored EOD without fetching or retrying any symbols
        required: false
        default: false
        type: boolean
      refresh_research:
        description: Refresh the full direct-source research archive after EOD (no backtest)
        required: false
        default: false
        type: boolean
      repair_missing:
        description: Explicit repair of missing symbols after the automatic retry budget is exhausted
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: protstock-eod
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.status.outputs.action }}
      matrix: ${{ steps.status.outputs.matrix }}
      trading_date: ${{ steps.status.outputs.trading_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Sync locked-universe exchange metadata from direct VCI with KBS fallback
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: protstock sync-exchanges
      - id: status
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
          FORCE_RERUN: ${{ inputs.force_rerun == true }}
          REPAIR_MISSING: ${{ inputs.repair_missing == true }}
        run: python .github/scripts/eod_status.py fast-lane

  check-universe:
    needs: preflight
    if: needs.preflight.outputs.action == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Check live universe
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: protstock assert-universe data/universe.csv
  ingest:
    needs: [preflight, check-universe]
    if: needs.preflight.outputs.action == 'RUN' && inputs.publish_only != true
    name: Fast ingest · 2 parallel lots
    outputs:
      source_ready: ${{ steps.source.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Check direct public sources and their KBS fallback
        id: source
        env:
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date }}
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python .github/scripts/market_source_health.py
      - run: protstock validate-universe data/universe.csv
      - name: Ingest and analyze two parallel lots
        id: ingest
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date }}
          SHARD_MATRIX: ${{ needs.preflight.outputs.matrix }}
          FORCE_RERUN: ${{ inputs.force_rerun == true }}
        run: python .github/scripts/eod_parallel.py
      - name: Hand off same-run computations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-analysis-parallel
          path: ${{ runner.temp }}/analysis/*.json.gz
          retention-days: 1
          if-no-files-found: ignore
      - name: Report partial shard
        if: failure() && steps.ingest.outcome == 'failure'
        run: echo "::error::This EOD shard failed; the workflow must remain failed even if other shards publish partial data."

  finalize:
    needs: [preflight, check-universe, ingest]
    if: always() && needs.preflight.outputs.action == 'RUN' && needs.check-universe.result == 'success' && (needs.ingest.outputs.source_ready == 'success' || inputs.publish_only == true)
    runs-on: ubuntu-latest
    outputs:
      trading_date: ${{ steps.finalize.outputs.trading_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: v0-analysis-*
          path: ${{ runner.temp }}/analysis
          merge-multiple: true
      - name: Publish market breadth and signals from available same-day snapshots
        id: finalize
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date }}
        run: python .github/scripts/finalize_eod.py
      - name: Report publish failure
        if: failure() && steps.finalize.outcome == 'failure'
        run: echo "::error::Same-day Market Health or signals could not be published; Telegram alerts are withheld."
      - name: Send final concise Telegram EOD alerts
        if: steps.finalize.outcome == 'success' && needs.ingest.result == 'success' && inputs.skip_alerts != true
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date }}
        run: |
          args=()
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          protstock send-eod-alerts "${args[@]}"

  report:
    needs: [preflight, check-universe, ingest, finalize]
    if: always() && (needs.preflight.outputs.action == 'RUN' || needs.preflight.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - name: Report EOD outcome even when source setup failed
        env:
          EOD_RESULTS: ${{ toJSON(needs) }}
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date || inputs.trading_date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/eod_report.py

  research-refresh:
    needs: [preflight, ingest, finalize]
    if: always() && inputs.refresh_research == true && needs.preflight.outputs.action == 'RUN' && needs.ingest.outputs.source_ready == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Refresh all universe research history from direct VCI with labelled KBS fallback
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date }}
        run: python .github/scripts/refresh_direct_research.py

  compact-source-refresh:
    needs: [research-refresh, finalize]
    if: always() && inputs.refresh_research == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Reclaim database space after the source refresh without deleting price rows
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python .github/scripts/compact_market_refresh.py

  dispatch-intraday:
    needs: [preflight, finalize]
    if: always() && needs.finalize.result == 'success' && needs.preflight.outputs.action == 'RUN'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start one Intraday workflow for the published EOD session
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date }}
        run: gh workflow run intraday-spikes.yml --ref "$GITHUB_REF_NAME" -f trading_date="$TRADING_DATE" -f notify="${{ inputs.skip_alerts != true }}"
