name: EOD pipeline

on:
  schedule:
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
    inputs:
      trading_date:
        description: Optional trading date (YYYY-MM-DD)
        required: false
        type: string
      symbol_limit:
        description: Optional symbol limit for a controlled test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: protstock-eod
  cancel-in-progress: false

jobs:
  validate-foundation:
    if: github.event_name == 'workflow_dispatch' || vars.EOD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,data]"
      - run: protstock validate-universe data/universe.csv
      - name: Run EOD ingestion and analysis
        env:
          SUPABASE_URL: https://kgglsqsvcofwhscakrtl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
          SYMBOL_LIMIT: ${{ inputs.symbol_limit }}
        run: |
          args=()
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          if [ -n "$SYMBOL_LIMIT" ]; then args+=(--symbol-limit "$SYMBOL_LIMIT"); fi
          protstock eod "${args[@]}" --source KBS --lookback-days 10
