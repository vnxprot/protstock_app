name: Sync KBS research history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First source date
        required: true
        default: '2021-01-01'
        type: string
      end_date:
        description: Last source date
        required: true
        default: '2026-09-30'
        type: string
      symbol_offset:
        description: Alphabetic offset including inactive symbols
        required: true
        default: '0'
        type: string
      symbol_limit:
        description: Number of symbols in this batch
        required: true
        default: '10'
        type: string
      symbols:
        description: Optional comma-separated override
        required: false
        default: ''
        type: string
      apply:
        description: Persist the KBS research series
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 1 * * 0'

permissions:
  contents: read
concurrency:
  group: protstock-research-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: python -m pip install -e .
      - name: Fetch and validate one coherent KBS history per symbol
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          SYMBOL_OFFSET: ${{ inputs.symbol_offset }}
          SYMBOL_LIMIT: ${{ inputs.symbol_limit }}
          SYMBOLS: ${{ inputs.symbols }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ]; then
            START_DATE=$(date -u -d '400 days ago' +%F)
            END_DATE=$(date -u +%F)
            SYMBOL_OFFSET=0
            SYMBOL_LIMIT=100000
            APPLY=true
          fi
          args=(--start-date "$START_DATE" --end-date "$END_DATE" --symbol-offset "$SYMBOL_OFFSET" --symbol-limit "$SYMBOL_LIMIT")
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          if [ "$APPLY" = 'true' ]; then args+=(--apply); fi
          protstock sync-research-prices "${args[@]}"
