name: Sync SSI universe history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1-5'

permissions:
  contents: read

concurrency:
  group: protstock-ssi-universe-history
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[ssi]'
      - name: Stage SSI prices and investor flows
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
          SHARD: ${{ matrix.shard }}
        run: python -m protstock.ssi_universe_history --shard "$SHARD" --shards 6
