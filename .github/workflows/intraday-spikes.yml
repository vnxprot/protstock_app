name: Intraday spike radar EOD

on:
  schedule:
    # 17:15 Asia/Ho_Chi_Minh, after the existing EOD publication.
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      trading_date:
        description: Completed trading date (YYYY-MM-DD); blank uses today in Vietnam
        required: false
        type: string
      symbols:
        description: Optional comma-separated symbols for a focused retry
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: protstock-intraday-spikes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[data]"
      - name: Collect minute bars and publish spike events
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          args=()
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          protstock intraday-spikes "${args[@]}"
