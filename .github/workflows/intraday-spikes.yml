name: Intraday spike radar EOD

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Explicitly rebuild all eligible symbols and reset the three-attempt recovery budget
        required: false
        default: false
        type: boolean
      trading_date:
        description: Completed trading date (YYYY-MM-DD); blank uses today in Vietnam
        required: false
        type: string
      notify:
        description: Send a same-day opportunity digest after publication
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: protstock-intraday-spikes
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.guard.outputs.action }}
      trading_date: ${{ steps.guard.outputs.trading_date }}
      matrix: ${{ steps.guard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - id: guard
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_REFRESH: ${{ inputs.force_refresh == true }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: python .github/scripts/intraday_radar_schedule.py preflight

  collect:
    needs: preflight
    if: needs.preflight.outputs.action == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "."
      - name: Collect minute bars and backfill matching VCI baseline
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date }}
          SYMBOLS: ${{ matrix.symbols }}
        run: protstock intraday-spikes --date "$TRADING_DATE" --symbols "$SYMBOLS" --pause-seconds 3

  finalize:
    needs: [preflight, collect]
    if: always() && (needs.preflight.outputs.action == 'RUN' || needs.preflight.outputs.action == 'FINALIZE_ONLY')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - name: Publish only when minute and baseline coverage reach 95 percent
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date }}
        run: python .github/scripts/intraday_radar_schedule.py finalize

  opportunities:
    needs: [preflight, finalize]
    if: always() && (needs.finalize.result == 'success' || needs.preflight.outputs.action == 'DONE')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Publish next-session opportunities after Radar, then notify once
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_DATE: ${{ needs.preflight.outputs.trading_date }}
          REPAIR: ${{ inputs.force_refresh }}
          NOTIFY: ${{ inputs.notify }}
        run: |
          args=(--end-date "$TRADING_DATE")
          if [ "$REPAIR" != 'true' ] && [ "$NOTIFY" = 'true' ]; then args+=(--notify); fi
          python -m protstock.opportunities "${args[@]}"

  report-failure:
    needs: [preflight, collect, finalize]
    if: always() && (needs.preflight.result == 'failure' || needs.collect.result == 'failure' || needs.finalize.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Report Radar failure independently of EOD success
        run: |
          echo '::error::Intraday Radar failed. Technical failures can be recovered by Intraday radar recovery; source/baseline gaps require attention.'
          echo 'Radar failed; EOD success does not imply Radar publication. See failed job logs for PostgreSQL/source details.' >> "$GITHUB_STEP_SUMMARY"
