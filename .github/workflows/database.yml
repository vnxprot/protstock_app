name: Database migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run first; deploy only after reviewing the plan
        required: true
        default: dry-run
        type: choice
        options: [dry-run, deploy]
      bootstrap_existing:
        description: Mark the already-installed Phase 1 migrations as applied
        required: true
        default: true
        type: boolean
      reconcile_phase2_to_5:
        description: Reapply Phase 2-5 when their migration history was marked applied after a rolled-back SQL attempt
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: protstock-database-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: upmqxwktvvguegqeqibn
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Bootstrap migration history
        if: inputs.bootstrap_existing
        run: supabase migration repair 20260909010000 20260909020000 --status applied --password "$SUPABASE_DB_PASSWORD"
      - name: Reconcile rolled-back Phase 2-5 history
        if: inputs.reconcile_phase2_to_5
        run: supabase migration repair 20260909030000 20260909040000 20260909050000 20260909060000 --status reverted --password "$SUPABASE_DB_PASSWORD"
      - name: Review migration plan
        if: inputs.mode == 'dry-run'
        run: supabase db push --dry-run --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: inputs.mode == 'deploy'
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Verify migration status
        if: always() && inputs.mode == 'deploy'
        run: |
          supabase migration list --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --linked --schema public --file remote_schema.sql
          grep -E '^CREATE TABLE public\.(technical_snapshots|support_resistance_zones|pattern_instances|pattern_points|fundamental_periods|fundamental_metrics|rules|rule_versions|signals|backtest_runs|backtest_trades|portfolios|positions|journal_entries)' remote_schema.sql || true
