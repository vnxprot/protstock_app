name: Database migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run first; deploy only after reviewing the plan
        required: true
        default: dry-run
        type: choice
        options: [dry-run, deploy]
      bootstrap_existing:
        description: Mark the already-installed Phase 1 migrations as applied
        required: true
        default: false
        type: boolean
      reconcile_phase2_to_5:
        description: Reapply Phase 2-5 when their migration history was marked applied after a rolled-back SQL attempt
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: protstock-database-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check required secrets
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)
      - name: Prepare IPv4 Session Pooler connection
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote

          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          url = (
              "postgresql://postgres.upmqxwktvvguegqeqibn:"
              f"{password}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SUPABASE_DB_URL={url}\n")
          print(f"::add-mask::{url}")
          print("Prepared Session Pooler connection for upmqxwktvvguegqeqibn.")
          PY
      - name: Bootstrap migration history
        if: inputs.bootstrap_existing
        run: supabase migration repair 20260909010000 20260909020000 --status applied --db-url "$SUPABASE_DB_URL"
      - name: Reconcile rolled-back Phase 2-5 history
        if: inputs.reconcile_phase2_to_5
        run: supabase migration repair 20260909030000 20260909040000 20260909050000 20260909060000 --status reverted --db-url "$SUPABASE_DB_URL"
      - name: Review migration plan
        if: inputs.mode == 'dry-run'
        run: supabase db push --dry-run --include-all --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        if: inputs.mode == 'deploy'
        run: supabase db push --include-all --db-url "$SUPABASE_DB_URL"
      - name: Verify migration status
        if: always() && inputs.mode == 'deploy'
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db dump --db-url "$SUPABASE_DB_URL" --schema public --file remote_schema.sql
          # Supabase quotes identifiers and emits IF NOT EXISTS / OR REPLACE.
          sed 's/"//g' remote_schema.sql > remote_schema_unquoted.sql
          for table in investment_theses investment_thesis_versions; do
            grep -Eq "^CREATE TABLE( IF NOT EXISTS)? public\.${table}[[:space:](]" remote_schema_unquoted.sql || { echo "Missing v4 table: $table"; exit 1; }
          done
          for function in record_portfolio_capital_movement record_portfolio_transaction portfolio_report_data search_consolidated_signals stock_analysis_data claim_backtest_jobs replace_backtest_trades save_investment_thesis apply_watchlist_entry; do
            grep -Eq "^CREATE( OR REPLACE)? FUNCTION public\.${function}\(" remote_schema_unquoted.sql || { echo "Missing v4 RPC: $function"; exit 1; }
          done
          grep -Eq '^CREATE( OR REPLACE)? FUNCTION public\.apply_watchlist_entry\(p_symbol text, p_patch jsonb, p_expected_user_id uuid\)' remote_schema_unquoted.sql || { echo 'Missing owner-pinned v4 watchlist RPC overload'; exit 1; }
          echo "Verified v4 thesis tables and all financial/query/worker RPC definitions."
