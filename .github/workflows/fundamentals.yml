name: Point-in-time fundamentals
on:
  workflow_dispatch:
    inputs:
      symbol_limit: { required: true, default: '5', type: string }
      symbols: { required: false, default: '', type: string }
      symbol_offset: { required: false, default: '0', type: string }
permissions: { contents: read }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -e '.[data]'
      - name: Collect selected symbols or an alphabetic slice
        run: |
          if [ -n "${{ inputs.symbols }}" ]; then
            protstock collect-fundamentals --limit '${{ inputs.symbol_limit }}' --symbols '${{ inputs.symbols }}'
          else
            protstock collect-fundamentals --limit '${{ inputs.symbol_limit }}' --symbol-offset '${{ inputs.symbol_offset }}'
          fi
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
