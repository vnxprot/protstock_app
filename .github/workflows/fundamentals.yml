name: Point-in-time fundamentals
on:
  workflow_dispatch:
    inputs:
      symbol_limit: { required: true, default: '5', type: string }
permissions: { contents: read }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -e '.[data]'
      - run: protstock collect-fundamentals --limit '${{ inputs.symbol_limit }}'
        env:
          SUPABASE_URL: https://kgglsqsvcofwhscakrtl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
