name: Point-in-time fundamentals
on:
  schedule:
    # 18:00 Asia/Ho_Chi_Minh, weekdays. One 10-symbol slice per run.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      symbol_limit: { required: true, default: '5', type: string }
      symbols: { required: false, default: '', type: string }
      symbol_offset: { required: false, default: '0', type: string }
permissions: { contents: read }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -e '.[data]'
      - name: Collect selected symbols or scheduled slice
        run: |
          if [ -n "${{ inputs.symbols }}" ]; then
            protstock collect-fundamentals --limit '${{ inputs.symbol_limit }}' --symbols '${{ inputs.symbols }}'
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            OFFSET=$(( (10#$(date -u +%j) % 21) * 10 ))
            protstock collect-fundamentals --limit 10 --symbol-offset "$OFFSET"
          else
            protstock collect-fundamentals --limit '${{ inputs.symbol_limit }}' --symbol-offset '${{ inputs.symbol_offset }}'
          fi
        env:
          SUPABASE_URL: https://kgglsqsvcofwhscakrtl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
