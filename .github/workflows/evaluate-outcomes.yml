name: Evaluate signal outcomes
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'
permissions:
  contents: read
concurrency:
  group: protstock-outcomes
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: python -m pip install -e .
      - name: Evaluate available 5/10/20-session outcomes without changing thresholds
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m protstock.cli evaluate-outcomes
