name: Replay MACD divergence research

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First assessment date
        required: true
        default: '2025-01-01'
        type: string
      end_date:
        description: Last assessment date
        required: true
        default: '2026-09-30'
        type: string
      symbol_offset:
        description: Alphabetic offset including inactive symbols
        required: true
        default: '0'
        type: string
      symbol_limit:
        description: Number of symbols in this batch
        required: true
        default: '10'
        type: string
      symbols:
        description: Optional comma-separated override
        required: false
        default: ''
        type: string
      apply:
        description: Historical persistence is disabled for database capacity; use dry-run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: python -m pip install -e .
      - name: Replay divergence using closed bars and next-session fills
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          SYMBOL_OFFSET: ${{ inputs.symbol_offset }}
          SYMBOL_LIMIT: ${{ inputs.symbol_limit }}
          SYMBOLS: ${{ inputs.symbols }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--start-date "$START_DATE" --end-date "$END_DATE" --symbol-offset "$SYMBOL_OFFSET" --symbol-limit "$SYMBOL_LIMIT")
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          if [ "$APPLY" = 'true' ]; then args+=(--apply); fi
          protstock replay-macd-divergence "${args[@]}"
