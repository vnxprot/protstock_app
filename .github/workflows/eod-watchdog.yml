name: EOD Watchdog

on:
  schedule:
    # 16:15 and 16:45 Vietnam: retry incomplete sessions after the initial lease.
    - cron: "15,45 9 * * 1-5"
  workflow_dispatch:
    inputs:
      trading_date:
        description: Optional completed trading date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  actions: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.status.outputs.action }}
      trading_date: ${{ steps.status.outputs.trading_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - id: status
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: python .github/scripts/eod_status.py watchdog

  dispatch:
    needs: inspect
    if: needs.inspect.outputs.action == 'DISPATCH_FAST_LANE'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Fast Lane once if today's EOD is absent or failed
        env:
          GH_TOKEN: ${{ github.token }}
          TRADING_DATE: ${{ needs.inspect.outputs.trading_date }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=(--ref main)
          if [ -n "$TRADING_DATE" ]; then args+=(-f "trading_date=$TRADING_DATE"); fi
          gh workflow run eod-fast.yml --repo "$REPOSITORY" "${args[@]}"
