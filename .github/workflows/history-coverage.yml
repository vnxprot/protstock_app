name: Historical data coverage report

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First session to audit
        required: true
        default: "2021-01-01"
        type: string
      end_date:
        description: Last session to audit; blank uses the current date
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --extra-index-url https://vnstocks.com/api/packages -e ".[data]"
      - name: Audit stored VNINDEX and symbol sessions
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          args=(--start-date "$START_DATE")
          if [ -n "$END_DATE" ]; then args+=(--end-date "$END_DATE"); fi
          protstock history-coverage "${args[@]}" > history-coverage.json
      - name: Publish concise summary
        run: |
          python -c "import json; r=json.load(open('history-coverage.json', encoding='utf-8')); print('## Historical data coverage'); print(); print(f\"- VNINDEX: {r['vnindex']['first_session']} -> {r['vnindex']['last_session']} ({r['vnindex']['sessions']} sessions)\"); print(f\"- Symbols: {r['symbols']}; complete after coverage start: {r['complete_after_coverage_start']}\"); print(f\"- Stock versus index calendar gaps: {r['calendar_gap_sessions']} across {r['symbols_with_calendar_gaps']} symbols (not automatically repairable)\"); print(f\"- Before first observed bar, listing date unknown: {r['unclassified_before_first_observation_sessions']} sessions\")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: history-coverage-${{ inputs.start_date }}-to-current
          path: history-coverage.json
          retention-days: 30
