name: Rebuild Market Health history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First date to rebuild (YYYY-MM-DD)
        required: true
        default: '2021-01-01'
        type: string
      end_date:
        description: Final date to rebuild (YYYY-MM-DD); blank uses today in Vietnam
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: protstock-market-health-history
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.'
      - name: Build historical Market Health from stored OHLCV
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          args=(--start-date "$START_DATE")
          if [ -n "$END_DATE" ]; then args+=(--end-date "$END_DATE"); fi
          protstock rebuild-market-health "${args[@]}"
