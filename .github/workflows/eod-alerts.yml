name: Send EOD alerts

on:
  workflow_dispatch:
    inputs:
      trading_date: { description: 'Date to check (YYYY-MM-DD)', required: true, default: '2026-09-10', type: string }

permissions: { contents: read }
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -e '.[data]'
      - run: protstock send-eod-alerts --date '${{ inputs.trading_date }}'
        env:
          SUPABASE_URL: https://kgglsqsvcofwhscakrtl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
