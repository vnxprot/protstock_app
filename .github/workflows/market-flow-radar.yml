name: Market Flow Radar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market-flow-radar.yml
      - supabase/migrations/*_market_flow_radar.sql
  schedule:
    - cron: '35 9 * * 1-5'
    - cron: '20 12 * * 1-5'
  workflow_dispatch:
    inputs:
      sessions:
        description: Recent sessions to refresh (1–20, latest tape only)
        type: number
        default: 5
      end:
        description: Optional final date (YYYY-MM-DD) for investor-flow history
        type: string
      tape_date:
        description: Optional closed session (YYYY-MM-DD) for Vietcap tape recovery
        type: string
      migrate:
        description: Apply Supabase migrations before collection
        type: boolean
        default: false
      reports_backfill:
        description: Fill the latest 50 report sessions subject to database headroom
        type: boolean
        default: false
      tape_history:
        description: Probe DNSE and fill missing trade tape for the latest 20 sessions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.tape_history && 'market-flow-radar-history' || 'market-flow-radar-production' }}
  cancel-in-progress: false

jobs:
  plan-tape:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.day.outputs.value }}
    steps:
      - id: day
        env:
          TAPE_DATE: ${{ inputs.tape_date }}
          HISTORY_END: ${{ inputs.end }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime, time, timedelta, timezone

          day = os.environ.get('TAPE_DATE')
          if day:
              date.fromisoformat(day)
          elif not os.environ.get('HISTORY_END'):
              now = datetime.now(timezone(timedelta(hours=7)))
              closed = now.date() if now.time() >= time(15, 15) else now.date() - timedelta(days=1)
              day = closed.isoformat() if closed.weekday() < 5 else ''
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'value={day or ""}', file=output)
          PY

  migrate:
    if: github.event_name == 'push' || inputs.migrate
    runs-on: ubuntu-latest
    concurrency:
      group: protstock-database-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Apply migrations to Supabase production
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from urllib.parse import quote

          password = quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          if not password:
              raise SystemExit('Missing SUPABASE_DB_PASSWORD')
          url = f'postgresql://postgres.upmqxwktvvguegqeqibn:{password}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres'
          print(f'::add-mask::{url}', flush=True)
          subprocess.run(['supabase', 'db', 'push', '--include-all', '--db-url', url], check=True)
          PY

  collect:
    needs: migrate
    if: ${{ !cancelled() && !inputs.tape_history && github.event.schedule != '35 9 * * 1-5' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[radar]'
      - name: Refresh market radar data
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_COUNT: ${{ inputs.sessions || (github.event_name == 'push' && 5) || 2 }}
          END_DATE: ${{ inputs.end }}
        run: |
          args=(--sessions "$SESSION_COUNT")
          if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
          python -m protstock.market_radar "${args[@]}"

  backfill-reports:
    needs: [migrate, collect]
    if: ${{ !cancelled() && needs.collect.result == 'success' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.reports_backfill) }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[radar]'
      - name: Fill missing report sessions in five-session batches
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m protstock.market_radar --backfill-reports

  collect-tape:
    needs: [migrate, plan-tape]
    if: ${{ !cancelled() && !inputs.tape_history && needs.plan-tape.outputs.day != '' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
      TAPE_DATE: ${{ needs.plan-tape.outputs.day }}
      SHARD: ${{ matrix.shard }}
      CAPTURE_FILE: .radar-candidate.json.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[radar]'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.CAPTURE_FILE }}
          key: radar-tape-v2-${{ env.TAPE_DATE }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-tape-v2-${{ env.TAPE_DATE }}-${{ matrix.shard }}-
            radar-tape-v1-${{ env.TAPE_DATE }}-${{ matrix.shard }}-
      - name: Capture trade tape before the provider rolls the session
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m protstock.market_radar --tape-date "$TAPE_DATE" --shard "$SHARD" --shards 6 --tape-cache "$CAPTURE_FILE" --tape-stage capture
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.CAPTURE_FILE }}
          key: radar-tape-v2-${{ env.TAPE_DATE }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Reconcile and publish trade tape
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          args=(--tape-date "$TAPE_DATE" --shard "$SHARD" --shards 6 --tape-cache "$CAPTURE_FILE" --tape-stage reconcile)
          python -m protstock.market_radar "${args[@]}"

  probe-dnse:
    needs: migrate
    if: ${{ !cancelled() && inputs.tape_history && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      available: ${{ steps.probe.outputs.available }}
    env:
      SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DNSE_API_KEY: ${{ secrets.DNSE_API_KEY }}
      DNSE_API_SECRET: ${{ secrets.DNSE_API_SECRET }}
      RADAR_DNSE_APPROVED: ${{ vars.RADAR_DNSE_APPROVED }}
      END_DATE: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: probe
        run: |
          if [[ "$RADAR_DNSE_APPROVED" != true || -z "$DNSE_API_KEY" || -z "$DNSE_API_SECRET" ]]; then
            echo '::warning::DNSE history deferred: DB publication rights, zero-cost use and API credentials must be confirmed.'
            exit 0
          fi
          python -m pip install -e '.[radar]' 'dnse-sdk-openapi==2.4.1'
          args=()
          if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
          python -m protstock.market_radar_history --probe "${args[@]}"
          echo 'available=true' >> "$GITHUB_OUTPUT"

  recover-tape-history:
    needs: probe-dnse
    if: needs.probe-dnse.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[radar]' 'dnse-sdk-openapi==2.4.1'
      - name: Recover 20 sessions of verified trade flow
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DNSE_API_KEY: ${{ secrets.DNSE_API_KEY }}
          DNSE_API_SECRET: ${{ secrets.DNSE_API_SECRET }}
          RADAR_DNSE_APPROVED: ${{ vars.RADAR_DNSE_APPROVED }}
          END_DATE: ${{ inputs.end }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=()
          if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
          python -m protstock.market_radar_history --shard "$SHARD" --shards 6 "${args[@]}"
