name: Repair missing historical prices

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First session to verify
        required: true
        default: "2021-01-01"
        type: string
      end_date:
        description: Last session to verify
        required: true
        default: "2026-09-24"
        type: string
      symbols:
        description: Comma-separated symbols; leave blank to repair the full universe
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: protstock-history-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[data]"
      - name: Fill only missing price sessions
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          protstock repair-history
          --start-date "${{ inputs.start_date }}"
          --end-date "${{ inputs.end_date }}"
          --symbols "${{ inputs.symbols }}"