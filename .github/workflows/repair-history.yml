name: Repair missing historical prices

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First session to verify
        required: true
        default: "2021-01-01"
        type: string
      end_date:
        description: Last session to verify
        required: true
        default: "2026-09-24"
        type: string
      symbols:
        description: Comma-separated symbols; leave blank to repair the full universe
        required: false
        default: ""
        type: string
      full_range:
        description: Fetch all available historical bars for the explicitly listed symbols only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: protstock-history-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[data]"
      - name: Fill only missing price sessions
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          SYMBOLS: ${{ inputs.symbols }}
          FULL_RANGE: ${{ inputs.full_range }}
        run: |
          args=(--start-date "$START_DATE" --end-date "$END_DATE")
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          if [ "$FULL_RANGE" = "true" ]; then args+=(--full-range); fi
          protstock repair-history "${args[@]}"
