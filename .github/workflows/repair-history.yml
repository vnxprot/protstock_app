name: Repair missing historical prices

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First session to verify
        required: true
        default: "2021-01-01"
        type: string
      end_date:
        description: Last session to verify; blank uses the current date
        required: false
        default: ""
        type: string
      symbols:
        description: Comma-separated symbols; leave blank to repair the full universe
        required: false
        default: ""
        type: string
      full_range:
        description: Fetch the complete window for the full universe or listed symbols
        required: false
        default: false
        type: boolean
      source:
        description: Data source; AUTO prefers VCI and falls back to KBS on source errors
        required: false
        default: AUTO
        type: choice
        options:
          - AUTO
          - VCI
          - KBS

permissions:
  contents: read

concurrency:
  group: protstock-history-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --extra-index-url https://vnstocks.com/api/packages -e ".[data]"
      - name: Rebase the full calculation window when repairing price sessions
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          SYMBOLS: ${{ inputs.symbols }}
          FULL_RANGE: ${{ inputs.full_range }}
          SOURCE: ${{ inputs.source }}
        run: |
          args=(--start-date "$START_DATE" --source "$SOURCE")
          if [ -n "$END_DATE" ]; then args+=(--end-date "$END_DATE"); fi
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          if [ "$FULL_RANGE" = "true" ]; then args+=(--full-range); fi
          protstock repair-history "${args[@]}"
