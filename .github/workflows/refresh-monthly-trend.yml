name: Apply unified monthly trend and refresh stored data

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: Completed stored EOD cutoff (YYYY-MM-DD)
        required: true
        default: '2026-10-15'
        type: string

permissions:
  contents: read

concurrency:
  group: protstock-eod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Prepare Supabase connection
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          if not password:
              raise RuntimeError('Missing database password')
          url = f'postgresql://postgres.upmqxwktvvguegqeqibn:{password}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres'
          print(f'::add-mask::{url}')
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write(f'SUPABASE_DB_URL={url}\n')
          PY
      - name: Apply approved trend migration
        run: supabase db push --include-all --yes --db-url "$SUPABASE_DB_URL"

  current:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.'
      - name: Recompute current outputs for frozen 277-symbol universe
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          END_DATE: ${{ inputs.end_date }}
        run: python -m protstock.trend_refresh --mode current --end "$END_DATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-current-report
          path: trend-refresh-current-*.json
          if-no-files-found: ignore
          retention-days: 14

  history:
    needs: [migrate, current]
    if: always() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.'
      - name: Refresh dependent research history since app inception
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          END_DATE: ${{ inputs.end_date }}
          SHARD: ${{ matrix.shard }}
        run: python -m protstock.trend_refresh --mode history --start 2026-09-11 --end "$END_DATE" --shard "$SHARD" --shards 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-history-${{ matrix.shard }}
          path: trend-refresh-history-*.json
          if-no-files-found: ignore
          retention-days: 14
