name: Fundamentals alphabetic backfill

on:
  workflow_dispatch:
    inputs:
      start_offset: { description: 'Alphabetic offset, normally 0', required: true, default: '0', type: string }
      end_offset: { description: 'Last offset inclusive, normally 200', required: true, default: '200', type: string }
      offsets: { description: 'Optional comma-separated retry offsets, e.g. 20,70', required: false, default: '', type: string }

permissions: { contents: read }

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -e '.[data]'
      - name: Process alphabetic batches of 10 sequentially
        shell: bash
        env:
          SUPABASE_URL: https://kgglsqsvcofwhscakrtl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          failures=0
          OFFSETS="${{ inputs.offsets }}"
          if [ -z "$OFFSETS" ]; then OFFSETS=$(seq ${{ inputs.start_offset }} 10 ${{ inputs.end_offset }} | tr '\n' ' '); fi
          for offset in ${OFFSETS//,/ }; do
            echo "::group::Alphabetic batch offset=$offset"
            protstock collect-fundamentals --limit 10 --symbol-offset "$offset"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
            sleep 180
          done
          echo "Completed with $failures failed batches. Review grouped logs for retry offsets."
          exit "$failures"
