name: Personal backtest queue
on:
  workflow_dispatch:
  schedule:
    # 16:00 / 16:30 Vietnam; queue claims have leases and row locks.
    - cron: "0,30 9 * * 1-5"
permissions:
  contents: read
concurrency:
  group: protstock-backtests
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e .
      - name: Claim and process queued backtests
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: protstock backtest-worker --limit 3
