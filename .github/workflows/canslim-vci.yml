name: CANSLIM VCI data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '35 8 * * 1-5'
  workflow_run:
    workflows: [EOD Fast Lane, EOD pipeline]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: protstock-canslim-vci
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: protstock-database-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Prepare Supabase connection
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote
          password = os.environ.get('SUPABASE_DB_PASSWORD', '')
          if not password:
              raise RuntimeError('Missing database password')
          url = f'postgresql://postgres.upmqxwktvvguegqeqibn:{quote(password, safe="")}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres'
          print(f'::add-mask::{url}')
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write(f'SUPABASE_DB_URL={url}\n')
          PY
      - name: Apply module schema
        run: supabase db push --include-all --yes --db-url "$SUPABASE_DB_URL"

  refresh:
    needs: migrate
    if: always() && ((github.event_name == 'workflow_dispatch' && needs.migrate.result == 'success') || (github.event_name == 'schedule') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Collect VCI company overview, vendor ratios, financials and prices
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m protstock.canslim_vci --shard ${{ matrix.shard }} --shards 4
