name: CI

on:
  push:
    branches: [main, codex/v4.0.0]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:sector
      - run: npm run test:watchlist
      - run: npm run test:portfolio
      - run: npm run test:journal
      - run: npm run test:signals
      - run: npm run test:runtime

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: protstock validate-universe data/universe.csv

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix .v4-sql-check --no-save --ignore-scripts @electric-sql/pglite@0.5.8
      - run: node tests/v4-migration-smoke.mjs
