name: EOD historical backfill

on:
  workflow_dispatch:
    inputs:
      start_offset:
        description: First zero-based alphabetic offset
        required: true
        default: '0'
        type: string
      end_offset:
        description: Final inclusive offset; blank means all active manifest symbols
        required: false
        default: ''
        type: string
      lookback_days:
        description: Calendar days of history per batch
        required: true
        default: '2200'
        type: string
      trading_date:
        description: Optional as-of trading date (YYYY-MM-DD)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: protstock-eod
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --extra-index-url https://vnstocks.com/api/packages -e '.[data]'
      - run: protstock validate-universe data/universe.csv
      - name: Process alphabetic batches sequentially
        shell: bash
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_OFFSET: ${{ inputs.start_offset }}
          END_OFFSET: ${{ inputs.end_offset }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          set +e
          date_args=()
          if [ -n "$TRADING_DATE" ]; then date_args+=(--date "$TRADING_DATE"); fi
          if [ -z "$END_OFFSET" ]; then
            END_OFFSET=$(python -c 'from protstock.universe import load_universe; print(sum(row.active for row in load_universe("data/universe.csv").rows)-1)')
          fi
          for offset in $(seq "$START_OFFSET" 10 "$END_OFFSET"); do
            echo "::group::EOD alphabetic batch offset=$offset"
            protstock eod "${date_args[@]}" --historical --skip-breadth-snapshot --source AUTO --lookback-days "$LOOKBACK_DAYS" --symbol-offset "$offset" --symbol-limit 10
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::EOD alphabetic batch offset=$offset failed"
              exit "$status"
            fi
            if [ "$offset" -lt "$END_OFFSET" ]; then sleep 180; fi
          done
          echo "Completed historical backfill with no failed batches."
      - name: Evaluate signals with the completed same-day market context
        id: rebuild
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          args=()
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          protstock rebuild-signals --historical "${args[@]}"
      - name: Process queued backtests
        if: always()
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: protstock backtest-worker --limit 10
      - name: Send one concise catch-up alert
        if: always() && steps.rebuild.outcome == 'success'
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: |
          args=()
          if [ -n "$TRADING_DATE" ]; then args+=(--date "$TRADING_DATE"); fi
          protstock send-eod-alerts "${args[@]}"
