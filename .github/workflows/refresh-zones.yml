name: Refresh zone quality from stored prices

on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: Cutoff date (YYYY-MM-DD); no upstream fetch or Telegram
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: protstock-eod
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Refresh D/W/M zone evidence only
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRADING_DATE: ${{ inputs.trading_date }}
        run: python -m protstock.zone_refresh --date "$TRADING_DATE"
