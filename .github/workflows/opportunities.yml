name: Publish next-session opportunities

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional historical start date; range runs never send Telegram
        type: string
      end_date:
        description: Completed date; blank uses today in Vietnam
        type: string
      notify:
        description: Send today's new shortlist after publication
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: protstock-opportunities
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Publish immutable same-session shortlist and optional digest
        env:
          SUPABASE_URL: https://upmqxwktvvguegqeqibn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          NOTIFY: ${{ inputs.notify }}
        run: |
          args=()
          if [ -n "$START_DATE" ]; then args+=(--start-date "$START_DATE"); fi
          if [ -n "$END_DATE" ]; then args+=(--end-date "$END_DATE"); fi
          if [ "$NOTIFY" = 'true' ] && [ -z "$START_DATE" ]; then args+=(--notify); fi
          python -m protstock.opportunities "${args[@]}"
