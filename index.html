<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07110e" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('protstock-theme'); } catch {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f7f5' : '#07110e';
      })();
    </script>
    <meta name="description" content="Prot Stock — phân tích cổ phiếu Việt Nam sau phiên giao dịch." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/prot-quant-p.png" type="image/png" />
    <link rel="apple-touch-icon" href="/prot-quant-p.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <title>Prot Stock v2.0.1</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
