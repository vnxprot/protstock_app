<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7f5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <style>:root{color-scheme:light;background:#f4f7f5}:root[data-theme="dark"]{color-scheme:dark;background:#07110e}html,body{margin:0;min-height:100%}</style>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('protstock-theme'); } catch {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        const background = theme === 'light' ? '#f4f7f5' : '#07110e';
        document.documentElement.style.backgroundColor = background;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = background;
        document.querySelector('meta[name="color-scheme"]').content = theme;
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = theme === 'light' ? 'default' : 'black-translucent';
        document.getElementById('app-manifest').href = theme === 'light' ? '/manifest.webmanifest' : '/manifest-dark.webmanifest';
      })();
    </script>
    <meta name="description" content="Prot Stock — phân tích cổ phiếu Việt Nam sau phiên giao dịch." />
    <link rel="icon" href="/prot-quant-p.png" type="image/png" />
    <link rel="apple-touch-icon" href="/prot-quant-p.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <title>Prot Stock v0.0.0</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
